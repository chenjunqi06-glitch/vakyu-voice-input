name: Verify published release assets
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to verify
        required: true
        type: string
permissions:
  contents: read
jobs:
  checksums:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download this repository release and verify hashes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          mkdir release-assets
          gh release download "$RELEASE_TAG" --repo "$GH_REPO" --dir release-assets
          cd release-assets
          test -f SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
